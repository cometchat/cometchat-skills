# >>> This file belongs in the PUBLIC repo: cometchat/cometchat-skills
# >>> Add it there as .github/workflows/publish-npm.yml  (it is NOT part of the
# >>> sync allowlist, so it will not be copied over automatically.)
#
# Publishes @cometchat/skills to npm when a release is published on the PUBLIC
# repo, using npm OIDC Trusted Publishing (no stored NPM_TOKEN) with provenance.
#
# One-time npm setup (org admin, on npmjs.com):
#   @cometchat/skills → Settings → Trusted Publishers → Add GitHub Actions:
#     Organization/repo: cometchat/cometchat-skills
#     Workflow filename: publish-npm.yml
#     Environment:       (leave blank, or "npm" if you add one below)

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # REQUIRED for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 (newer than the npm bundled
      # with Node 22). Upgrade in-runner.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Publish (provenance via OIDC — no token)
        run: npm publish --provenance --access public
